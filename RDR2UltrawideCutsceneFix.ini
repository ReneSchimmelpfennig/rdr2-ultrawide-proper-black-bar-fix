; RDR2 Ultrawide Proper Black Bar Fix
;
; Place this file next to RDR2UltrawideCutsceneFix.asi, in the game folder.
; It is optional: without it the recommended defaults below are used.
;
; These settings only apply to aspect ratios wider than 21:9 (such as 32:9).
; On 21:9 and narrower they have no effect at all.

[Cutscenes]

; Behaviour for resolutions wider than 21:9.
;
;   false  (recommended)  Show black bars on the left and right only, keeping
;                         the intended picture composition.
;
;   true                  Expand cutscenes on the sides. Not recommended:
;                         may show things that weren't intended to be seen.
;
ExpandCutscenesSideways = false
