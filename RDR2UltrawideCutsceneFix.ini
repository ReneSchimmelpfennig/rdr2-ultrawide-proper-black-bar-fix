; RDR2 Ultrawide Proper Black Bar Fix
;
; Place this file next to RDR2UltrawideCutsceneFix.asi, in the game folder.
; It is optional: without it the recommended defaults below are used.
;
; Each setting says which resolutions it applies to.

[Cutscenes]

; Applies to aspect ratios wider than 21:9 (such as 32:9) only.
; On 21:9 and narrower this setting has no effect at all.
;
; Behaviour for resolutions wider than 21:9.
;
;   false  (recommended)  Show black bars on the left and right only, keeping
;                         the intended picture composition.
;
;   true                  Expand cutscenes on the sides. Not recommended:
;                         may show things that weren't intended to be seen.
;
ExpandCutscenesSideways = false


; Applies to every resolution, ultrawide or not.
;
; Remove the black bars everywhere, not only in cutscenes.
;
;   true   (default)      Bars are removed everywhere: cutscenes, the scene after
;                         the intro video, the pause menu, shops and photo mode.
;
;   false                 Keep the bars outside cutscenes. Worth trying if you
;                         see an unprocessed strip where a bar used to be -- the
;                         screen effects behind them are still drawn for a 16:9
;                         window -- or if you simply prefer the menu framed.
;
RemoveAllBlackBars = true
